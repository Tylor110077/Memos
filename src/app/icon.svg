<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1c1c30"/>
      <stop offset="1" stop-color="#0a0a14"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 圆角方形背景 -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>

  <!-- 核心光晕 -->
  <circle cx="256" cy="256" r="150" fill="url(#halo)"/>

  <!-- 连接线 -->
  <g stroke-linecap="round">
    <line x1="256" y1="256" x2="146" y2="158" stroke="#8b5cf6" stroke-opacity="0.55" stroke-width="5"/>
    <line x1="256" y1="256" x2="378" y2="168" stroke="#22d3ee" stroke-opacity="0.5" stroke-width="5"/>
    <line x1="256" y1="256" x2="164" y2="372" stroke="#60a5fa" stroke-opacity="0.5" stroke-width="5"/>
    <line x1="256" y1="256" x2="372" y2="366" stroke="#f472b6" stroke-opacity="0.5" stroke-width="5"/>
    <line x1="146" y1="158" x2="378" y2="168" stroke="#a78bfa" stroke-opacity="0.22" stroke-width="3"/>
    <line x1="164" y1="372" x2="372" y2="366" stroke="#a78bfa" stroke-opacity="0.22" stroke-width="3"/>
  </g>

  <!-- 卫星知识节点 -->
  <circle cx="146" cy="158" r="24" fill="#a78bfa"/>
  <circle cx="378" cy="168" r="19" fill="#22d3ee"/>
  <circle cx="164" cy="372" r="19" fill="#60a5fa"/>
  <circle cx="372" cy="366" r="22" fill="#f472b6"/>

  <!-- 核心节点 -->
  <circle cx="256" cy="256" r="52" fill="url(#coreGlow)"/>
  <circle cx="256" cy="256" r="52" fill="none" stroke="#ddd6fe" stroke-opacity="0.7" stroke-width="3"/>
  <circle cx="240" cy="240" r="14" fill="#ede9fe" fill-opacity="0.55"/>
</svg>
